<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratik Ray - Security Engineer | Cybersecurity Portfolio</title>
    <meta name="description" content="Pratik Ray - Security Engineer specializing in Application Security, API Pentesting, and WAF Engineering. Based in Bengaluru.">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #141b2d;
            --bg-tertiary: #1a2332;
            --accent-primary: #00ff88;
            --accent-secondary: #00d9ff;
            --text-primary: #e8eaed;
            --text-secondary: #a0a5b0;
            --danger: #ff4757;
            --warning: #ffa502;
            --success: #00ff88;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background-image: 
                linear-gradient(90deg, var(--accent-primary) 1px, transparent 1px),
                linear-gradient(0deg, var(--accent-primary) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Particle System */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-100px) translateX(50px); }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-primary);
            font-family: 'Courier New', monospace;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-primary);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .typing-container {
            height: 50px;
            margin-bottom: 1.5rem;
        }

        .typing-text {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            font-family: 'Courier New', monospace;
            border-right: 2px solid var(--accent-primary);
            white-space: nowrap;
            overflow: hidden;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: var(--accent-primary); }
            51%, 100% { border-color: transparent; }
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .btn-secondary:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .hero-image {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--accent-primary);
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.2);
            transition: all 0.3s;
        }

        .profile-container:hover .profile-img {
            transform: scale(1.05);
            box-shadow: 0 30px 80px rgba(0, 255, 136, 0.3);
        }

        .profile-border {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid var(--accent-secondary);
            border-radius: 25px;
            animation: borderPulse 3s infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
        }

        /* Section Styles */
        section {
            padding: 6rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 1.5rem;
        }

        /* About Section */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 3rem;
            align-items: start;
        }

        .about-image {
            position: relative;
        }

        .about-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid var(--accent-primary);
        }

        .about-text {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 15px;
            border-left: 4px solid var(--accent-primary);
        }

        .about-text p {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 2rem;
        }

        .stat-card {
            text-align: center;
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
        }

        .stat-number {
            font-size: 2.5rem;
            color: var(--accent-primary);
            font-weight: bold;
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .skill-category {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
        }

        .skill-category:hover {
            border-color: var(--accent-primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }

        .skill-category h3 {
            color: var(--accent-primary);
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .skill-list {
            list-style: none;
        }

        .skill-item {
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skill-item:last-child {
            border-bottom: none;
        }

        .skill-name {
            color: var(--text-primary);
        }

        .skill-level {
            display: flex;
            gap: 3px;
        }

        .skill-dot {
            width: 8px;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 50%;
        }

        .skill-dot.active {
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        /* Experience Section */
        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
        }

        .timeline-item {
            position: relative;
            margin-bottom: 3rem;
            padding-left: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.5rem;
            top: 0;
            width: 12px;
            height: 12px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent-primary);
        }

        .experience-card {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
        }

        .experience-card:hover {
            border-color: var(--accent-primary);
            transform: translateX(10px);
        }

        .experience-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .experience-title {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .experience-company {
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        .experience-date {
            color: var(--accent-secondary);
            font-size: 0.9rem;
        }

        .experience-description {
            list-style: none;
            margin-top: 1rem;
        }

        .experience-description li {
            padding: 0.5rem 0;
            color: var(--text-secondary);
            padding-left: 1.5rem;
            position: relative;
        }

        .experience-description li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--accent-primary);
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.2);
        }

        .project-header {
            padding: 1.5rem;
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--accent-primary);
        }

        .project-title {
            font-size: 1.3rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .project-date {
            color: var(--accent-secondary);
            font-size: 0.9rem;
        }

        .project-body {
            padding: 1.5rem;
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .tag {
            background: var(--bg-primary);
            color: var(--accent-primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        /* Certifications Section */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .cert-card {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            text-align: center;
            transition: all 0.3s;
        }

        .cert-card:hover {
            border-color: var(--accent-primary);
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }

        .cert-icon {
            font-size: 3rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }

        .cert-name {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .cert-org {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Terminal Section */
        .terminal {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-primary);
        }

        .terminal-header {
            background: #2d2d2d;
            padding: 0.8rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-body {
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            min-height: 200px;
        }

        .terminal-line {
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .terminal-prompt {
            color: var(--accent-primary);
        }

        .terminal-input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            outline: none;
            width: 100%;
        }

        /* Contact Section */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
        }

        .contact-item:hover {
            border-color: var(--accent-primary);
            transform: translateX(10px);
        }

        .contact-icon {
            font-size: 2rem;
            color: var(--accent-primary);
        }

        .contact-details h3 {
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .contact-details a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        .contact-form {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-tertiary);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            padding: 2rem 5%;
            text-align: center;
            border-top: 1px solid rgba(0, 255, 136, 0.1);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .social-link {
            color: var(--text-secondary);
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .social-link:hover {
            color: var(--accent-primary);
            transform: translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-image {
                order: -1;
            }

            .profile-container {
                width: 300px;
                height: 300px;
            }

            .about-content {
                grid-template-columns: 1fr;
            }

            .contact-container {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .hero-text h1 {
                font-size: 2.5rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scroll Animation */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s ease;
        }

        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Particle Component
        const Particles = () => {
            const particles = Array.from({ length: 50 }, (_, i) => ({
                id: i,
                left: `${Math.random() * 100}%`,
                top: `${Math.random() * 100}%`,
                delay: `${Math.random() * 15}s`
            }));

            return (
                <div className="particles">
                    {particles.map(p => (
                        <div
                            key={p.id}
                            className="particle"
                            style={{
                                left: p.left,
                                top: p.top,
                                animationDelay: p.delay
                            }}
                        />
                    ))}
                </div>
            );
        };

        // Navigation Component
        const Navigation = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <nav style={{ boxShadow: scrolled ? '0 10px 30px rgba(0,0,0,0.3)' : 'none' }}>
                    <div className="nav-container">
                        <div className="logo">&gt; Pratik_Ray</div>
                        <ul className="nav-links">
                            <li><a onClick={() => scrollToSection('about')}>About</a></li>
                            <li><a onClick={() => scrollToSection('skills')}>Skills</a></li>
                            <li><a onClick={() => scrollToSection('experience')}>Experience</a></li>
                            <li><a onClick={() => scrollToSection('projects')}>Projects</a></li>
                            <li><a onClick={() => scrollToSection('certifications')}>Certifications</a></li>
                            <li><a onClick={() => scrollToSection('contact')}>Contact</a></li>
                        </ul>
                    </div>
                </nav>
            );
        };

        // Typing Animation Component
        const TypingAnimation = () => {
            const roles = [
                'Security Engineer',
                'Application Security',
                'API Penetration Tester',
                'WAF Security Engineer',
                'Vulnerability Assessment Expert'
            ];
            const [text, setText] = useState('');
            const [roleIndex, setRoleIndex] = useState(0);
            const [isDeleting, setIsDeleting] = useState(false);

            useEffect(() => {
                const currentRole = roles[roleIndex];
                const timeout = setTimeout(() => {
                    if (!isDeleting) {
                        if (text.length < currentRole.length) {
                            setText(currentRole.substring(0, text.length + 1));
                        } else {
                            setTimeout(() => setIsDeleting(true), 2000);
                        }
                    } else {
                        if (text.length > 0) {

            const [count, setCount] = useState(0);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            let start = 0;
                            const increment = end / (duration / 16);
                            const timer = setInterval(() => {
                                start += increment;
                                if (start >= end) {
                                    setCount(end);
                                    clearInterval(timer);
                                } else {
                                    setCount(Math.floor(start));
                                }
                            }, 16);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.5 }
                );

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [end, duration]);
